[project]
name = "motor-insurance-pricing"
version = "0.1.0"
description = "Actuarial Data Science & Motor Insurance Pricing: GLMs vs XGBoost on French MTPL Portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "openml>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "ipykernel>=6.29.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
